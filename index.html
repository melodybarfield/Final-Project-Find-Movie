<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindMovie</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/4efb33348e.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav__wrapper">
          <!-- <figure class="img__wrapper">
            <img src="./assets/logo_small.png" alt="Logo" />
          </figure> -->
          <ul class="nav__link-list">
            <li>
              <a href="#" class="nav__link gold">Home</a>
            </li>
            <li>
              <a href="#" class="nav__link nav__link--primary light-gold"
                >Find Movie</a
              >
            </li>
            <li>
              <a href="#" class="nav__link gold btn-contact" onclick="toggleModal()">Contact</a>
            </li>
          </ul>
          <button class="btn__menu" onclick="openMenu()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="btn__menu--svg"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="light___StyledCloseIcon-lj69nl-14 fASujC"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <ul class="menu__links">
              <li class="menu__list">
                <a href="#home" class="menu__link" onclick="closeMenu()"
                  >Home</a
                >
              </li>
              <li class="menu__list">
                <a href="#FindMovie" class="menu__link" onclick="closeMenu()"
                  >Find Movie</a
                >
              </li>
              <li class="menu__list">
                <a href="#contact" class="menu__link" onclick="closeMenu()" onclick="toggleModal()"
                  >Contact</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="landing-page">
        <img src="./assets/star_big.png" alt="" class="shape shape--1" />
        <img src="./assets/star_big.png" alt="" class="shape shape--2" />
        <img src="./assets/star_big.png" alt="" class="shape shape--3" />
        <img src="./assets/star_big.png" alt="" class="shape shape--4" />
        <img src="./assets/star_big.png" alt="" class="shape shape--5" />
        <img src="./assets/star_big.png" alt="" class="shape shape--6" />
        <img src="./assets/star_big.png" alt="" class="shape shape--7" />
        <img src="./assets/star_big.png" alt="" class="shape shape--8" />
        <img src="./assets/star_big.png" alt="" class="shape shape--9" />
        <img src="./assets/star_big.png" alt="" class="shape shape--10" />
        <img src="./assets/star_big.png" alt="" class="shape shape--11" />
        <div class="container">
          <div class="row">
            <h1 class="section__title blue">
              Missouri's greatest Movie Library
            </h1>
            <h2 class="section__sub-title serif-font">
              Find your next Favorite Movie
            </h2>
            <div class="input__wrapper">
              <input
                type="text"
                placeholder="Search by Title, Type or Year"
                class="searchbar"
              />
              <button class="findMovie-btn">Find Movie</button>
            </div>
            <div class="img__logo--wrapper">
              <img src="./assets/logo_complex.png" class="img__logo" alt="" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <div class="modal">
      <div class="modal__contact">
        <i
          class="fa-solid fa-xmark modal__exit click"
          onclick="toggleModal()"
        ></i>
        <h3 class="modal__title">Let us know how we do!</h3>
        <h4 class="modal__sub-title">Your feedback is important to us.</h4>
        <form id="contact__form" onsubmit="contact(event)">
          <div class="form__item">
            <label class="form__item--label">Name</label>
            <input type="text" class="input" name="user_name" required />
          </div>
          <div class="form__item">
            <label class="form__item--label">Email</label>
            <input type="email" class="input" name="user_email" required />
          </div>
          <div class="form__item">
            <label class="form__item--label">Message</label>
            <textarea
              class="input"
              name="message"
              type="text"
              required
            ></textarea>
          </div>
          <button id="contact__submit" class="form__submit">Submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
