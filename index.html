<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindMovie</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav__wrapper">
          <figure class="img__wrapper">
            <img src="./assets/logo_small.png" alt="Logo" />
          </figure>
          <ul class="nav__link-list">
            <li>
              <a href="#" class="link gold">Home</a>
            </li>
            <li>
              <a href="#" class="link blue">Find Movie</a>
            </li>
            <li>
              <a href="#" class="link gold btn-contact">Contact</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <section class="landing-page">
        <div class="container">
          <div class="row">
            <h1 class="section__title blue">
              Missouri's biggest Movie Library
            </h1>
            <h2 class="section__sub-title light-blue">
              Find your next Favorite Movie
            </h2>
            <div class="input__wrapper">
              <input
                type="text"
                placeholder="Search by Title, Type or Year"
                class="searchbar"
              />
              <button class="FindMovie-btn">Find Movie</button>
            </div>
            <div class="img__logo">
              <img src="./assets/logo.png" alt="" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
