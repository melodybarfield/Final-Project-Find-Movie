<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Library Display</title>
    <link rel="stylesheet" href="movie.css" />
    <script
      src="https://kit.fontawesome.com/4efb33348e.js"
      crossorigin="anonymous"
    ></script>
    <script src="movie.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        emailjs.init({
          publicKey: "lUInOT4KOXFuYh21a",
        });
      })();
    </script>
  </head>
  <body>
    <header>
      <div class="header__modal">
        <nav>
          <div class="nav__wrapper">
            <figure class="nav__logo--wrapper">
              <img
                src="./assets/transparent company logo.png"
                alt="Company Logo"
                class="nav__logo--img"
              />
            </figure>
            <ul class="nav__link--list">
              <li>
                <a href="#" class="nav__link gold">Home</a>
              </li>
              <li>
                <a href="#" class="nav__link nav__link--primary light-gold"
                  >Find Movie</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="nav__link gold btn-contact"
                  onclick="toggleModal()"
                  >Contact</a
                >
              </li>
            </ul>
          </div>
        </nav>
        <div class="searchbar__wrapper">
          <h1 class="header__title">Browse Movies</h1>
          <input
            type="text"
            placeholder="Search by Title, Type or Year"
            class="searchbar"
          />
          <button class="findMovie-btn">Find Movie</button>
        </div>
      </div>
    </header>
    <section class="search__results"></section>
  </body>
</html>
