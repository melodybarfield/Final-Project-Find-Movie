<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Library Display</title>
    <link rel="stylesheet" href="movie.css" />
    <script
      src="https://kit.fontawesome.com/4efb33348e.js"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        emailjs.init({
          publicKey: "lUInOT4KOXFuYh21a",
        });
      })();
    </script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        emailjs.init({
          publicKey: "lUInOT4KOXFuYh21a",
        });
      })();
    </script>
    <script src="movie.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header__modal">
        <nav>
          <div class="nav__wrapper">
            <figure class="nav__logo--wrapper">
              <img
                src="./assets/simplified black and white logo with name.png"
                alt="Company Logo"
                class="nav__logo--img"
              />
            </figure>
            <ul class="nav__link--list">
              <li>
                <a href="#" class="nav__link gold">Home</a>
              </li>
              <li>
                <a href="#" class="nav__link nav__link--primary"
                  >Find Movie</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="nav__link btn-contact"
                  onclick="toggleModal()"
                  >Contact</a
                >
              </li>
            </ul>
          <button class="btn__menu" onclick="openMenu()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="btn__menu--svg"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="light___StyledCloseIcon-lj69nl-14 fASujC"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <ul class="menu__links">
              <li class="menu__list">
                <a href="#home" class="menu__link" onclick="closeMenu()"
                  >Home</a
                >
              </li>
              <li class="menu__list">
                <a href="#FindMovie" class="menu__link" onclick="closeMenu()"
                  >Find Movie</a
                >
              </li>
              <li class="menu__list">
                <a
                  href="#contact"
                  class="menu__link"
                  onclick="
                    closeMenu();
                    toggleModal();
                  "
                  >Contact</a
                >
              </li>
            </ul>
            </div>
        </nav>
        <div class="searchbar__wrapper">
          <h1 class="header__title">Browse Movies</h1>
          <div class="input__wrapper">
            <input
              type="text"
              placeholder="Search for a movie..."
              class="searchbar"
              id="searchInput"
            />
            <div class="img__wrapper">
              <i class="fa-solid fa-magnifying-glass search__button" id="searchButton"></i>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="movie_display">
      <div class="control_panel">
        <p class="resultsInfo" id="resultsInfo">Showing:</p>
        <div>
          <label for="sortSelect">Sort:</label>
          <select id="sortSelect">
            <option value="select">Select</option>
            <option value="a-z">A-Z</option>
            <option value="z-a">Z-A</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
      </div>
      <div class="container">
        <div class="row">
          <div class="movie-grid" id="movieGrid">
            <div class="movie-card">
              <img src="${movie.Poster}" alt="${movie.Title}" class="movie-card__img">
              <h2 class="movie-card__title">${movie.Title}</h2>
              <p class="movie-card__year">${movie.Year}</p>
            </div>
            <!-- <div class="movie-card__placeholder">Movie Poster <br> Not Available</div> -->
          </div>
        </div>
      </div>
    </main>
    <footer>
      <p>Created by Melody Barfield. Powered by OMDBapi.</p>
    </footer>
    <div class="modal">
      <div class="modal__contact">
        <div class="modal__header">
          <i class="fa-solid fa-xmark modal__exit click" onclick="toggleModal()"></i>
          <h3 class="modal__title">Let us know how we do!</h3>
          <h4 class="modal__sub-title">Your feedback is important to us.</h4>
        </div>
        <div class="modal__body">
          <form id="contact__form" onsubmit="contact(event)">
            <div class="form__item">
              <label class="form__item--label">Name</label>
              <input type="text" class="input" name="user_name" required="">
            </div>
            <div class="form__item">
              <label class="form__item--label">Email</label>
              <input type="email" class="input" name="user_email" required="">
            </div>
            <div class="form__item">
              <label class="form__item--label">Message</label>
              <textarea class="input" name="message" type="text" required=""></textarea>
            </div>
          </form>
        </div>
        <div class="modal__footer">
          <button id="contact__submit" class="form__submit" form="contact__form">
            Submit
          </button>
        </div>

        <div class="modal__overlay modal__overlay--loading">
          <i class="fa-solid fa-spinner"></i>
        </div>
        <div class="modal__overlay modal__overlay--success">
          " Thank you for your message.<br>We appreciate your feedback!"
        </div>
      </div>
    </div>
  </body>
</html>
