<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Library Display</title>
    <link rel="stylesheet" href="movies.css" />
    <script
      src="https://kit.fontawesome.com/4efb33348e.js"
      crossorigin="anonymous"
    ></script>
    <script src="movies.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        emailjs.init({
          publicKey: "lUInOT4KOXFuYh21a",
        });
      })();
    </script>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav__wrapper">
          <div class="logo__wrapper">
            <img src="./assets/company_logo.png" alt="Company Logo" />
          </div>
          <ul class="nav__link--list">
            <li>
              <a href="#" class="nav__link gold">Home</a>
            </li>
            <li>
              <a href="#" class="nav__link nav__link--primary light-gold"
                >Find Movie</a
              >
            </li>
            <li>
              <a
                href="#"
                class="nav__link gold btn-contact"
                onclick="toggleModal()"
                >Contact</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>
  </body>
</html>
